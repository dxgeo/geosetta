[package]
name = "geosetta"
version = "0.23.0"
edition = "2024"
description = "Convert between open vector geospatial formats (GeoJSON, GeoParquet, FlatGeobuf, GeoPackage, Shapefile, KML/KMZ, CSV, WKT), dependency-free."
license = "MIT"
# Dev-only tooling kept in the repo but out of the published crate.
exclude = ["bench/"]

[lib]
name = "geosetta"
path = "src/lib.rs"

[[bin]]
name = "geosetta"
path = "src/main.rs"

[dependencies]
# Optional embedded CRS registry data (PROJ/EPSG/Esri/IGN/IAU/NKG-derived). Kept
# in a sibling crate so its third-party dataset terms are isolated and the default
# build stays dependency-free. Enabled by the `crs-registry` feature.
geoscribe = { path = "../geoscribe", version = "0.3.0", optional = true }

[dev-dependencies]
# Used only by tests/reproject_pipe.rs, to prove the reprojection seam
# (`FeatureCollection::for_each_position_mut`) composes with a real,
# independently-authored reprojection crate — wbprojection has no CLI binary,
# so unlike GDAL/PROJ (exercised via stdin/stdout piping in the same test
# file) it's linked directly instead. `default-features = false` skips the
# `parallel` (rayon) feature, which the tests don't need.
wbprojection = { version = "0.3.3", default-features = false }

[features]
# CRS registry: resolve a source's (authority, code) to an authoritative CRS
# definition via the embedded proj.db-derived table (see geoscribe/NOTICE
# for data terms). OFF by default: the default build stays pure-MIT and
# dependency-free; opt in with --features crs-registry.
crs-registry = ["dep:geoscribe"]

[profile.release]
lto = true
codegen-units = 1
