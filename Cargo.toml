[package]
name = "geosetta"
version = "0.24.0"
edition = "2024"
description = "Convert between open vector geospatial formats (GeoJSON, GeoParquet, FlatGeobuf, GeoPackage, Shapefile, KML/KMZ, CSV, WKT), carrying Z/M ordinates and CRS labels through. Warns on stderr whenever a conversion would drop something the target format cannot represent. Dependency-free, standard library only."
license = "MIT"
# Dev-only tooling kept in the repo but out of the published crate.
exclude = ["bench/"]

[lib]
name = "geosetta"
path = "src/lib.rs"

[[bin]]
name = "geosetta"
path = "src/main.rs"

[dependencies]
# None. The crate is standard-library only, unconditionally. A CRS geosetta
# cannot resolve structurally is supplied at run time as text via `--crs`
# (see plans/crs-external-resolution.org) rather than by a compiled-in registry,
# so there is no optional dependency either.

[dev-dependencies]
# Used only by tests/reproject_pipe.rs, to prove the reprojection seam
# (`FeatureCollection::for_each_position_mut`) composes with a real,
# independently-authored reprojection crate — wbprojection has no CLI binary,
# so unlike GDAL/PROJ (exercised via stdin/stdout piping in the same test
# file) it's linked directly instead. `default-features = false` skips the
# `parallel` (rayon) feature, which the tests don't need.
wbprojection = { version = "0.3.3", default-features = false }

# Intra-doc links are part of the docs staying true: a link that silently stops
# resolving (a renamed item, a module demoted to `pub(crate)`) is the same class
# of drift as prose going stale, so it fails the build rather than scrolling past
# as a warning. `private_intra_doc_links` additionally catches a *public* item's
# docs pointing at crate-internal code — the link cannot exist on docs.rs, so it
# should be a plain code span instead.
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.release]
lto = true
codegen-units = 1
